name: Website audit

on:
  push:
    branches:
      - main
    paths:
      - app/**
      - public/**
      - scripts/audit-website.mjs
      - package.json
      - .github/workflows/audit-website.yml
  workflow_dispatch:
    inputs:
      base_url:
        description: Website base URL to audit
        required: false
        default: https://softstrangestudio.github.io/Angels-Website/
      routes:
        description: Comma-separated route list
        required: false
        default: /,/about/,/notes/,/portfolio/,/store/

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run audit
        env:
          AUDIT_BASE_URL: ${{ inputs.base_url || 'https://softstrangestudio.github.io/Angels-Website/' }}
          AUDIT_ROUTES: ${{ inputs.routes || '/,/about/,/notes/,/portfolio/,/store/' }}
        run: node scripts/audit-website.mjs --base="$AUDIT_BASE_URL" --routes="$AUDIT_ROUTES"

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-audit-logs
          path: logs/
          retention-days: 14
